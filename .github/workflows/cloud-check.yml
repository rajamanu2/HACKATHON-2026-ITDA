name: Cloud container check
on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - cloud/**
      - src/**
      - scripts/local-n8n.mjs
      - .github/workflows/cloud-check.yml
jobs:
  container:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: docker build -t drishti-cloud-check .
      - name: Start isolated persistent-volume container
        run: docker run -d --user 0 --name care-check -p 127.0.0.1:54173:4173 --mount type=volume,source=care-check-data,target=/app/.local drishti-cloud-check
      - name: Wait for app health and verify model architecture
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:54173/api/health > /tmp/care-health.json; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:54173/api/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:54173/api/patients)" = 401
          docker exec care-check /opt/ai/bin/python scripts/research-ai.py --check
          docker exec care-check node -e "const s=require('node:fs').readFileSync('/proc/1/status','utf8');if(!/^Uid:\s+1000\s+1000/m.test(s))throw Error('Supervisor did not drop root privileges');console.log('Application supervisor runs without root privileges.');"
      - name: Restart and verify persistent identity
        run: |
          docker restart care-check
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:54173/api/health > /tmp/care-health-after.json; then break; fi
            sleep 2
          done
          node --input-type=module -e "import{readFileSync}from'node:fs';const a=JSON.parse(readFileSync('/tmp/care-health.json')),b=JSON.parse(readFileSync('/tmp/care-health-after.json'));if(a.instanceId!==b.instanceId)throw Error('Persistent identity changed');console.log('Persistent identity survived container restart.');"
      - name: Show non-secret service logs on failure
        if: failure()
        run: docker logs --tail 100 care-check || true
      - name: Clean isolated CI containers
        if: always()
        run: |
          docker rm -f care-check || true
          docker volume rm care-check-data || true
